spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/myapp_db}
    username: ${SPRING_DATASOURCE_USERNAME:myapp_user}
    password: ${SPRING_DATASOURCE_PASSWORD:myapp_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
