version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: myapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-myapp_db}
      MYSQL_USER: ${MYSQL_USER:-myapp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-myapp_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: myapp-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-myapp_db}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-myapp_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-myapp_pass}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: myapp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:8080

volumes:
  mysql_data:
